[program:graphite]
command = /usr/local/bin/gunicorn -b 127.0.0.1:8080 -w 2 --pythonpath /usr/share/graphite-web/ wsgi:application
directory = /usr/share/graphite-web/
user = _graphite 
autostart = true
autorestart = true
stdout_logfile = /webapps/logs/graphite_gunicorn_supervisor.log
redirect_stderr = true
environment=LANG=en_US.UTF-8,LC_ALL=en_US.UTF-8
