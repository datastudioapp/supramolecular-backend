[program:statsd]
command = /usr/bin/node stats.js config.js                              ; Command to start app
directory = /opt/statsd/
user = webadmin                                                         ; User to run as
autostart = true
autorestart = true
stdout_logfile = /webapps/logs/statsd_supervisor.log                    ; Where to write log messages
redirect_stderr = true                                                  ; Save stderr in the same log
environment=LANG=en_US.UTF-8,LC_ALL=en_US.UTF-8                         ; Set UTF-8 as default encoding
